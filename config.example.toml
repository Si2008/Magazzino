# File di esempio della configurazione: copiare in config.toml e
# sostituire i valori segnaposto con quelli reali.
# NON commitare config.toml: contiene le credenziali del database.

[database]
host = "localhost"
porta = 5432
utente = "postgres"
password = "LA_TUA_PASSWORD"
dbname = "magazzino_profili"

# Dimensioni dell'etichetta in millimetri: l'etichetta si adatta a
# qualsiasi stampante per etichette Windows.
[etichette]
larghezza_mm = 60
altura_mm = 30

# Backup automatico: cartella, intervallo (ore) e numero di backup conservati.
[backup]
cartella = "backup"
intervallo_ore = 6
max_backup = 7
pg_dump = "C:/percorso/a/pg_dump.exe"

# Controllo delle scadenze barcode (48 ore in stato «Scaricato»): il worker
# gira nel processo del server web, così chiude la finestra non lo ferma.
# Intervallo tra un controllo e l'altro, in secondi (default: 300 = 5 minuti).
[scadenze]
intervallo_secondi = 300

# Catalogo delle immagini di sezione (Fase 7): cartella di PNG il cui nome è
# il codice del profilo (es. AZ2001.png). Se omesso, si usa la cartella
# ``catalogo_immagini`` accanto a config.toml / all'eseguibile.
# Percorso relativo: risolto rispetto a quella stessa cartella.
[immagini]
catalogo = "catalogo_immagini"

# Accesso libero da telefono: nessun account o token applicativo.
# Modalità consigliata per rete mobile: tunnel HTTPS con origine solo loopback.
[web]
host = "127.0.0.1"
porta = 8443
tls_proxy_locale = true
avvio_automatico = true
# Inserire l'URL HTTPS assegnato al tunnel/VPN. Non inventare un indirizzo.
url_pubblico = ""
# Per HTTPS diretto, impostare tls_proxy_locale=false e configurare:
# certificato_pem = "C:/certificati/certificato.pem"
# chiave_privata = "C:/certificati/chiave_privata.key"

# Feed di aggiornamento (Fase 13): il server web espone il manifest firmato
# e l'installer; l'app desktop li scarica e li verifica (firma Ed25519).
[update]
# true = controllo del feed in background dopo l'apertura della finestra.
abilitato = true
# Manifest pubblico firmato; il programma scarica il pacchetto completo.
feed_url = "https://github.com/Si2008/Magazzino/releases/latest/download/manifest.json"
# Cartella con manifest.json e MagazzinoProfili-<X.Y.Z>.exe
# (percorso relativo: rispetto a questo file di configurazione).
cartella_rilasci = "release"
